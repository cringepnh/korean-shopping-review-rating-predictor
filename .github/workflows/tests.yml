name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Only the pure-Python test suite runs in CI: data_utils.py and
      # reporting.py deliberately avoid importing torch/transformers so this
      # job doesn't need a GPU wheel or a multi-minute install.
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
